<h2>Albums List</h2>

<div *ngIf="loading">
  <p>Loading albums...</p>
</div>

<div *ngIf="!loading && albums.length === 0">
  <p>No albums found.</p>
</div>

<ul *ngIf="!loading">
  <li *ngFor="let album of albums">
    <strong>ID:</strong> {{ album.id }} |
    <a [routerLink]="['/albums', album.id]">
      {{ album.title }}
    </a>

    <button (click)="deleteAlbum(album.id)">
      Delete
    </button>
  </li>
</ul>
